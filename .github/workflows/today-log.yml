name: Log today's lake score

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake today's score into the page
        run: python3 scripts/log_today.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet today/index.html; then
            git config user.name "keowee-today-bot"
            git config user.email "actions@github.com"
            git add today/index.html
            git commit -m "Log today's lake score"
            git pull --rebase origin main
            git push origin main
          else
            echo "no change"
          fi
