name: Deploy Pages

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          # full history so the IndexNow step can diff against the pushed-from commit
          fetch-depth: 0

      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview
          path: preview

      - name: Render pages from data
        run: |
          for d in main preview; do
            if [ -f "$d/scripts/render_spots.py" ]; then python3 "$d/scripts/render_spots.py" "$d"; fi
            if [ -f "$d/scripts/render_guides.py" ]; then python3 "$d/scripts/render_guides.py" "$d"; fi
            if [ -f "$d/scripts/render_weekend.py" ]; then python3 "$d/scripts/render_weekend.py" "$d"; fi
          done

      - name: Assemble site (main at root, preview under /preview/)
        run: |
          mkdir -p _site/preview
          rsync -a --exclude='.git' --exclude='.github' main/ _site/
          rsync -a --exclude='.git' --exclude='.github' preview/ _site/preview/
          python3 preview/scripts/prepare_preview.py _site/preview

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Announce changed pages to Bing/Yandex instead of waiting to be crawled.
      # Main only: preview lives under /preview/ and is disallowed in robots.txt.
      - name: Ping IndexNow
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        working-directory: main
        run: |
          python3 scripts/ping_indexnow.py --changed \
            "${{ github.event.before }}" "${{ github.sha }}"
