    transparent:true,

    fragmentShader:GLSL_RAMPS+`

  scene.add(new THREE.Mesh(g,terrMat));

  // water: one plane per lake, clipped and tinted per pixel
  [['keowee',120],['jocassee',240]].forEach(function(pair){

    var minx=W,maxx=0,miny=H,maxy=0;
    for(var yy=0;yy<H;yy+=2)for(var xx=0;xx<W;xx+=2){
      if(maskB[yy*W+xx]===lv){if(xx<minx)minx=xx;if(xx>maxx)maxx=xx;if(yy<miny)miny=yy;if(yy>maxy)maxy=yy;}

    var wgeo=new THREE.BufferGeometry();
    var wp=[],wu=[];
    [[minx,miny],[maxx,miny],[minx,maxy],[maxx,maxy]].forEach(function(p){
      wp.push((p[0]-W/2)*resX*KM,0,(p[1]-H/2)*resY*KM);
      wu.push(p[0]/(W-1),p[1]/(H-1));
    });
    wgeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(wp),3));
    wgeo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(wu),2));
    wgeo.setIndex([0,2,1,1,2,3]);
    var wmat=new THREE.ShaderMaterial({
      transparent:true,depthWrite:false,
      uniforms:THREE.UniformsUtils.merge([{
        uElev:{value:null},uMaskN:{value:null},uMaskL:{value:null},
        uLakeVal:{value:lv},uWaterY:{value:0},uTime:{value:0},uSun:{value:null},uTint:{value:null},uCam:{value:new THREE.Vector3()}
      }]),
      vertexShader:'varying vec2 vUv;varying vec3 vW;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
      fragmentShader:GLSL_RAMPS+`

    });

    el.addEventListener('click',function(ev){

    [-82.955,34.662,2600],[-82.905,34.703,950],[-82.955,34.716,600],

    [-82.900,34.902,700],[-82.882,34.930,900],[-82.924,34.956,650],

}

function frame(){
  if(!intro.done&&intro.t0){
    var t=(performance.now()-intro.t0)/intro.dur;
    if(t>=1){intro.done=true;}
    else{
      t=t*t*(3-2*t);
      camera.position.lerpVectors(intro.from,intro.to,t);
      camera.position.y+=Math.sin(Math.PI*t)*2.2;
      camera.lookAt(controls.target);
    }
  }
  if(tour){
    var tt=(performance.now()-tour)/46000;
    if(tt>=1){endTour();}
    else{
      camera.position.copy(tourCurve.getPointAt(tt));
      var g=tourLook.getPointAt(Math.min(1,tt+0.05));
      camera.lookAt(g);
      var best=null,bd=1e9,nowT=performance.now();
      landmarks.forEach(function(l){
        var dx=l.pos.x-g.x,dz=l.pos.z-g.z,d2=dx*dx+dz*dz;
        l.el.classList.toggle('lit',d2<6.8);
      });
      ramps.forEach(function(rp){
        var dx=rp.pos.x-g.x,dz=rp.pos.z-g.z,d2=dx*dx+dz*dz;
        var lit=d2<6.8;
        rp.el.classList.toggle('lit',lit);
        if(lit&&!tourSeen.has(rp)){tourSeen.add(rp);tourQueue.push(rp);}
      });
      // every passed pin gets a captioned moment, in order, min dwell each
      var DWELL=3000;
      if(tourFeat===null||nowT-tourFeatT>DWELL){
        var next=tourQueue.shift()||null;
        if(next||nowT-tourFeatT>DWELL){tourFeat=next;tourFeatT=nowT;}
      }
      if(tourFeat){
        probe.textContent=tourFeat.r.n;
        probe.classList.add('tourcap');
        probe.style.display='block';
      }else probe.style.display='none';
    }
  }
  else if(intro.done){
    controls.update();
    if(panBounds){
      var t2=controls.target;
      t2.x=Math.max(-panBounds.x,Math.min(panBounds.x,t2.x));
      t2.z=Math.max(-panBounds.z,Math.min(panBounds.z,t2.z));
      t2.y=Math.max(panBounds.y-0.5,Math.min(panBounds.y+2.5,t2.y));
    }
  }
  tickDrain();
  tickLabels();
  var tm=performance.now()/1000;
  Object.keys(waterMeshes).forEach(function(k){
    var u=waterMeshes[k].material.uniforms;
    u.uCam.value.copy(camera.position);
    u.uTime.value=tm;
  });
  renderer.render(scene,camera);
}

function tickLabels(){
  if(!landmarks.length)return;
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  var w=canvas.clientWidth,h=canvas.clientHeight,v=new THREE.Vector3();
  landmarks.forEach(function(l){
    v.copy(l.pos).project(camera);
    if(v.z<1&&Math.abs(v.x)<1.02&&Math.abs(v.y)<1.02){
      l.el.style.display='block';
      l.el.style.left=((v.x*0.5+0.5)*w)+'px';
      l.el.style.top=((-v.y*0.5+0.5)*h)+'px';
    }else l.el.style.display='none';
  });
  if(sunWorldPos){
    var sd=document.getElementById('sunDisc');
    v.copy(sunWorldPos).project(camera);
    if(v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1){
      sd.style.display='block';
      sd.style.left=((v.x*0.5+0.5)*w)+'px';
      sd.style.top=((-v.y*0.5+0.5)*h)+'px';
    }else sd.style.display='none';
  }
  var rcard=document.getElementById('rcard');
  var down=liveDeficit.keowee+drainFt;
  ramps.forEach(function(rp){
    if(!rampsOn){rp.el.style.display='none';return;}
    v.copy(rp.pos).project(camera);
    if(v.z<1&&Math.abs(v.x)<1.02&&Math.abs(v.y)<1.02){
      rp.el.style.display='block';
      rp.el.style.left=((v.x*0.5+0.5)*w)+'px';
      rp.el.style.top=((-v.y*0.5+0.5)*h)+'px';
      rp.el.classList.toggle('dry',down>15&&rp.r.kind!=='eat');
      if(openRamp===rp){rcard.style.left=rp.el.style.left;rcard.style.top=(parseFloat(rp.el.style.top)-8)+'px';}
    }else{rp.el.style.display='none';if(openRamp===rp){openRamp=null;rcard.style.display='none';}}
  });
}

function homeCam(t){
  camera.position.set(t.x+14,t.y+11,t.z+17);
  controls.target.copy(t);
}
function endTour(){
  tour=null;tourFeat=null;
  probe.classList.remove('tourcap');
  document.querySelectorAll('.lit').forEach(function(e){e.classList.remove('lit');});
  probe.style.display='none';
  document.getElementById('tourBtn').textContent='Fly the lake';
  if(controls.target)homeCam(controls.target.clone());
  controls.autoRotate=true;
}
// NOAA-style solar position for the lake (34.85N, -82.93W)
function solarInfo(){
  var LAT=34.85*Math.PI/180,LNG=-82.93;
  var now=new Date();
  var start=new Date(now.getFullYear(),0,0);
  var doy=Math.floor((now-start)/864e5);
  var g=2*Math.PI/365*(doy-1);
  var decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  var eqt=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  var ha=Math.acos(Math.cos(90.833*Math.PI/180)/(Math.cos(LAT)*Math.cos(decl))-Math.tan(LAT)*Math.tan(decl));
  var riseUTC=720-4*(LNG+ha*180/Math.PI)-eqt;
  var setUTC=720-4*(LNG-ha*180/Math.PI)-eqt;
  function toLocal(mins){
    var d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),0,mins));
    return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'});
  }
  var azRise=Math.acos(Math.sin(decl)/Math.cos(LAT));
  return {riseAz:azRise,setAz:2*Math.PI-azRise,riseT:toLocal(riseUTC),setT:toLocal(setUTC)};
}
function compass(az){
  var dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(az/(Math.PI/8))%16];
}
function setSunMode(mode){
  sunMode=mode;
  var chip=document.getElementById('sunChip'),disc=document.getElementById('sunDisc'),btn=document.getElementById('sunBtn');
  if(!sunShared)return;
  if(mode==='day'){
    sunShared.uSun.value.set(-0.55,0.62,0.46).normalize();
    sunShared.uTint.value.set(1,1,1);
    sunShared.uAmb.value=0.35;
    chip.style.display='none';disc.style.display='none';
    sunWorldPos=null;
    btn.textContent='Sunset';
    return;
  }
  var s=solarInfo();
  var az=mode==='sunset'?s.setAz:s.riseAz;
  var el=5.5*Math.PI/180;
  var dir=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el));
  sunShared.uSun.value.copy(dir);
  if(mode==='sunset'){
    sunShared.uTint.value.set(1.18,0.78,0.55);
    chip.textContent='Sunset today '+s.setT+' · '+compass(az);
    btn.textContent='Sunrise';
  }else{
    sunShared.uTint.value.set(1.08,0.88,0.74);
    chip.textContent='Sunrise today '+s.riseT+' · '+compass(az);
    btn.textContent='Daylight';
  }
  sunShared.uAmb.value=0.2;
  chip.style.display='block';
  sunWorldPos=controls.target.clone().add(dir.clone().multiplyScalar(60));
  disc.style.display='block';
}
document.getElementById('sunBtn').addEventListener('click',function(){
  setSunMode(sunMode==='day'?'sunset':sunMode==='sunset'?'sunrise':'day');
});
document.getElementById('shareBtn').addEventListener('click',function(){
  var btn=this,url='https://keowee.club/depth/';
  var payload={title:'The Lake Keowee Depth Map',text:'Drain Lake Keowee yourself. Live 3D depth map of Keowee & Jocassee.',url:url};
  if(navigator.share){navigator.share(payload).catch(function(){});}
  else{
    function done(){btn.textContent='Link copied!';setTimeout(function(){btn.textContent='Share';},2000);}
    function legacy(){
      var t=document.createElement('textarea');
      t.value=url;t.style.position='fixed';t.style.opacity='0';
      document.body.appendChild(t);t.select();
      try{document.execCommand('copy');done();}catch(e){}
      document.body.removeChild(t);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(done).catch(legacy);
    else legacy();
  }
});

function updateWater(){
  Object.keys(waterMeshes).forEach(function(name){
    var elev=surfaces[name]-(liveDeficit[name]+drainFt)*FT;
    waterMeshes[name].position.y=elev*EXAG*KM;
    waterMeshes[name].material.uniforms.uWaterY.value=elev;
    if(terrUniforms)terrUniforms[name==='keowee'?'uWaterYK':'uWaterYJ'].value=elev;
  });
}
var drain=document.getElementById('drain'),drainOut=document.getElementById('drainOut');
drain.addEventListener('input',function(){
  if(drainAnim){drainAnim=null;document.getElementById('drainPlay').textContent='Drain it';}
  drainFt=parseFloat(drain.value)||0;
  drainOut.textContent=drainFt===0?FULL_LABEL:'−'+drainFt+' ft';
  updateWater();
});

function tickDrain(){
  if(!drainAnim)return;
  var e=(performance.now()-drainAnim)/1000,v;
  function ss(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
  if(e<4.5)v=ss(e/4.5)*300;
  else if(e<6)v=300;
  else if(e<10.5)v=300*(1-ss((e-6)/4.5));
  else{v=0;drainAnim=null;document.getElementById('drainPlay').textContent='Drain it';}
  drainFt=Math.round(v/5)*5;
  drain.value=drainFt;
  drainOut.textContent=drainFt===0?FULL_LABEL:'−'+drainFt+' ft';
  updateWater();
}
document.getElementById('drainPlay').addEventListener('click',function(){
  if(drainAnim){drainAnim=null;this.textContent='Drain it';}
  else{drainAnim=performance.now();this.textContent='Stop';}
});

var probe=document.getElementById('probe');
function probeAt(clientX,clientY){
  if(!samp||!meta)return probe.style.display='none';
  var r=canvas.getBoundingClientRect();
  var nx=((clientX-r.left)/r.width)*2-1,ny=-((clientY-r.top)/r.height)*2+1;
  var dir=new THREE.Vector3(nx,ny,0.5).unproject(camera).sub(camera.position).normalize();
  var hit=null;
  ['keowee','jocassee'].forEach(function(name){
    if(hit)return;
    var planeY=surfaces[name]*EXAG*KM;
    var t=(planeY-camera.position.y)/dir.y;
    if(t<=0)return;
    var p=camera.position.clone().addScaledVector(dir,t);
    var s=samp.world(p.x,p.z);
    if(s&&((name==='keowee'&&s.m===120)||(name==='jocassee'&&s.m===240)))
      hit={ft:Math.round((surfaces[name]-s.e)/FT)};
  });
  if(hit&&hit.ft>=3){
    probe.textContent='≈ '+hit.ft+' ft deep';
    probe.style.display='block';
    probe.style.left=(clientX-r.left)+'px';
    probe.style.top=(clientY-r.top)+'px';
  }else probe.style.display='none';
}
canvas.addEventListener('pointermove',function(e){
  if(e.buttons!==0){probe.style.display='none';return;}
  probeAt(e.clientX,e.clientY);
});
canvas.addEventListener('pointerleave',function(){probe.style.display='none';});

fetch('https://api.hydro-derived.duke-energy.app/lakes/current-level')
  .then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(lakes){
    [['keowee','KEOWEE'],['jocassee','JOCASSEE']].forEach(function(p){
      var l=lakes.find(function(x){return x.LakeName===p[1];});
      var a=l&&parseFloat(l.Actual);
      if(a&&!isNaN(a))liveDeficit[p[0]]=Math.max(0,100-a);
    });
    var d=liveDeficit.keowee;
    document.getElementById('liveText').textContent='Live · Keowee '+(d<=0.1?'at full pond':(Math.round(d*10)/10)+' ft below full');
    updateWater();
  })
  .catch(function(){
    document.getElementById('liveText').textContent='Live level unavailable · showing full pond';
  });

function resize(){
  var st=canvas.parentElement.getBoundingClientRect();
  renderer.setSize(st.width,st.height,false);
  lineMats.forEach(function(m){m.resolution.set(st.width,st.height);});
  camera.aspect=st.width/st.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);
resize();
